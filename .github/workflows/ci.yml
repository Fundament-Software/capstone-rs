permissions:
  contents: read

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  minrust: 1.93.0

jobs:
  build:
    strategy:
      matrix:
        rust:
          - beta
          - stable
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
          
    - name: Install Clang
      run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo apt install -y clang-20
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-20 60
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-20 60
          
    - name: Test feature flags
      run: |
          cd capnp
          cargo test --no-default-features
          cargo test --features sync_reader
          cargo test --features unaligned
          cd ../

    - name: Build
      run: cargo build --all

    - name: Run tests
      run: cargo test --all

    - name: Run example
      run: ./target/debug/addressbook write | ./target/debug/addressbook read

    - name: Build in release mode
      run: cargo build --all --release

    - name: Test in release mode
      run: cargo test --all --release

    - name: Run benchmark
      run: ./target/release/run_all_benchmarks target/release/benchmark

  miri:
    name: "Miri"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: miri

      - name: Setup miri
        run: cargo miri setup
          
      - name: Install Clang
        run: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y clang-20
            sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-20 60
            sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-20 60

      - name: Test default features
        run: cargo miri test --package capstone --package capnpc-test

      - name: Test no default features
        run: cargo miri test --package capstone --package capnpc-test --no-default-features

      - name: Test default features 32-bit
        run: cargo miri test --package capstone --package capnpc-test --target i686-unknown-linux-gnu

      - name: Test no default features 32-bit
        run: cargo miri test --package capstone --package capnpc-test --no-default-features --target i686-unknown-linux-gnu

      - name: Test sync_reader
        run: cargo miri test --package capstone --package capnpc-test --features sync_reader

      - name: Test unaligned
        run: cargo miri test --package capstone --package capnpc-test --features unaligned

  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check --unstable-features --error-on-unformatted

  clippy:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Install Cap'n Proto
        run: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get install -y capnproto libcapnp-dev

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-02
          components: clippy
      - uses: actions-rs-plus/clippy-check@v2.7.1
        with:
          args: --all --all-targets

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        log-level: warn
        command: check
        arguments: --all-features
